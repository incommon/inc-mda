image:
  maven:3.3.9-jdk-8

stages:
  - mirror
  - test

variables:
  #
  # maven.repo.local points Maven at a local repository, which will
  # be cached across runs.
  #
  # `showDateTime` will show the passed time in milliseconds. You need to
  # specify `--batch-mode` to make this work.
  #
  # The other two defines will supress any download for dependencies and
  # plugins or upload messages which would clutter the console log.
  #
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=WARN -Dorg.slf4j.simpleLogger.showDateTime=true -Djava.awt.headless=true"
  # As of Maven 3.3.0 instead of this you may define these options in `.mvn/maven.config` so the same config is used
  # when running from the command line.
  # `installAtEnd` and `deployAtEnd`are only effective with recent version of the corresponding plugins.
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version -DinstallAtEnd=true -DdeployAtEnd=true"

# Cache the Maven repository across runs.
cache:
  key: ${CI_BUILD_REF_NAME}
  paths:
    - .m2

mirror:
  stage: mirror
  tags:
    - linux
  cache: {}
  script:
    # run ssh-agent
    - eval $(ssh-agent -s)
    # add appropriate private key to the agent store
    - ssh-add <(echo "$MIRROR_KEY")
    # set known hosts list
    # WARNING: use only in docker container, if you use it with shell you will
    # overwrite your user's ssh config
    - mkdir -p ~/.ssh
    - cp deploy/known_hosts ~/.ssh/known_hosts
    # Do a bare clone of the repository
    - git clone --bare $CI_REPOSITORY_URL
    # Mirror push it to the destination
    - cd $CI_PROJECT_NAME.git
    - git push --mirror $MIRROR_DEST

test:
  stage: test
  tags:
    - linux
  script:
    - mvn $MAVEN_CLI_OPTS clean test
